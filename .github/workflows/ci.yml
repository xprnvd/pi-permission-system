name: CI

on:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    # The sync only dispatches this workflow when upstream has released
    # something new, so the trusted-publisher check runs on its own weekly
    # schedule for the weeks when nothing moved.
    - cron: "17 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # Publish to npm when a version tag is pushed, or when the sync workflow
    # dispatches this workflow after copying a new upstream release.
    #
    # Authentication is npm's trusted publishing: the npm CLI exchanges this
    # workflow's OIDC identity for a short-lived publish token. There is no
    # npm token in this repository, and nothing long-lived to leak or rotate.
    if: >-
      (github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'xprnvd/pi-permission-system'
    runs-on: ubuntu-latest
    # The daily dispatch and a manual dispatch must not publish at the same
    # time. The version check below is a check-then-act, so two overlapping
    # runs would both try to publish the same version.
    concurrency:
      group: publish-pi-permission-system
      cancel-in-progress: false
    permissions:
      contents: read
      # Required for the OIDC exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Run the upstream checks
        run: npm run check
      - name: Verify the trusted publisher
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          # The package the publish step will use, built from the same scope
          # variable, so the check and the publish cannot disagree.
          scope="${PD_SCOPE:-@xprnvd}"
          PKG="${scope}/pi-permission-system"
          # The registry's OIDC exchange is what the trusted publisher
          # authorizes. Asking for the exchange token proves that npm still
          # trusts this repository and this workflow for this package, without
          # publishing anything. A dry run cannot do this: it fails on npm's
          # local check for a version that already exists, whether or not the
          # exchange would have worked.
          id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "::error::could not get an OIDC token from the runner"
            exit 1
          fi
          response=$(curl -sS -X POST -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$(echo "$PKG" | sed 's|/|%2f|')")
          if echo "$response" | jq -e '.token' > /dev/null 2>&1; then
            echo "trusted publisher accepted for $PKG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the trusted publisher is not configured for $PKG"
            echo "$response"
            exit 1
          fi
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
      - name: Check whether the version is already on npm
        id: check
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          version="$(node -p "require('./package.json').version")"
          if npm view "${scope}/pi-permission-system@${version}" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif npm view "${scope}/pi-permission-system@${version}" version 2>&1 | grep -q "E404"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not read the registry, not publishing on a guess"
            exit 1
          fi
      - name: Set the published package identity
        if: steps.check.outputs.published == 'true'
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          npm pkg set name="${scope}/pi-permission-system"
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/xprnvd/pi-permission-system.git"
          npm pkg delete repository.directory || true
          # The package page must not send readers to the upstream project's
          # pages. This is the fork pd publishes from.
          npm pkg set homepage="https://github.com/xprnvd/pi-permission-system"
          npm pkg set bugs.url="https://github.com/xprnvd/pi-permission-system/issues"
      # Trusted publishing generates the provenance attestation on its own;
      # --provenance keeps it explicit, so a broken attestation fails the
      # publish instead of shipping a package without one.
      - name: Publish to npm
        if: steps.check.outputs.published == 'true'
        working-directory: .
        run: npm publish --provenance --access public
