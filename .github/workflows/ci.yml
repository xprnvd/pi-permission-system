name: CI

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # Publish to npm when a version tag is pushed, or when the sync workflow
    # dispatches this workflow after copying a new upstream release.
    #
    # Authentication is npm's trusted publishing: the npm CLI exchanges this
    # workflow's OIDC identity for a short-lived publish token. There is no
    # npm token in this repository, and nothing long-lived to leak or rotate.
    if: >-
      (github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'xprnvd/pi-permission-system'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Verify the trusted publisher
        run: |
          # A dry run performs npm's OIDC exchange without publishing, so this
          # reports whether the trusted publisher on npmjs.com still names
          # this repository and this workflow. It fails the job when the
          # exchange is refused, instead of waiting for the next release to
          # fail the same way.
          if npm publish --dry-run --ignore-scripts --json > /tmp/dry-run.json 2>/tmp/dry-run.err; then
            echo "trusted publisher accepted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the trusted publisher is not configured for this package"
            cat /tmp/dry-run.err
            exit 1
          fi
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
      - name: Check whether the version is already on npm
        id: check
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          version="$(node -p "require('./package.json').version")"
          if npm view "${scope}/pi-permission-system@${version}" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set the published package identity
        if: steps.check.outputs.published == 'true'
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          npm pkg set name="${scope}/pi-permission-system"
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/xprnvd/pi-permission-system.git"
          npm pkg delete repository.directory || true
      # Trusted publishing generates the provenance attestation on its own;
      # --provenance keeps it explicit, so a broken attestation fails the
      # publish instead of shipping a package without one.
      - name: Publish to npm
        if: steps.check.outputs.published == 'true'
        working-directory: .
        run: npm publish --provenance --access public
